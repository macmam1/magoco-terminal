<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAGoCo Terminal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #0d1117;
            --bg-header: #161b22;
            --bg-input: #0d1117;
            --text: #c9d1d9;
            --text-muted: #8b949e;
            --green: #3fb950;
            --blue: #58a6ff;
            --red: #f85149;
            --yellow: #d29922;
            --cyan: #39d353;
            --border: #30363d;
            --prompt: #7ee787;
        }
        
        body {
            font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Header */
        .header {
            background: var(--bg-header);
            border-bottom: 1px solid var(--border);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .header-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--green);
        }
        
        .header-version {
            font-size: 11px;
            color: var(--text-muted);
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            animation: pulse 2s infinite;
        }
        
        .status-dot.offline { background: var(--red); animation: none; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .header-actions {
            display: flex;
            gap: 8px;
        }
        
        .btn {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-family: inherit;
        }
        
        .btn:hover { border-color: var(--blue); color: var(--blue); }
        
        /* Terminal */
        .terminal {
            flex: 1;
            padding: 12px 16px;
            overflow-y: auto;
            background: var(--bg);
            font-size: 13px;
            line-height: 1.5;
        }
        
        .terminal-line { margin: 2px 0; white-space: pre-wrap; word-break: break-all; }
        .cmd-line { color: var(--prompt); }
        .out-line { color: var(--text); }
        .err-line { color: var(--red); }
        .info-line { color: var(--cyan); }
        .warn-line { color: var(--yellow); }
        
        /* Input Area */
        .input-area {
            background: var(--bg-header);
            border-top: 1px solid var(--border);
            padding: 10px 16px;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .prompt {
            color: var(--prompt);
            font-weight: 600;
            white-space: nowrap;
        }
        
        #cmd {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }
        
        #runBtn {
            background: var(--green);
            color: var(--bg);
            border: none;
            padding: 6px 16px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-size: 12px;
        }
        
        #runBtn:hover { background: var(--cyan); }
        #runBtn:disabled { background: var(--border); cursor: not-allowed; }
        
        /* Status Bar */
        .status-bar {
            background: var(--bg-header);
            border-top: 1px solid var(--border);
            padding: 4px 16px;
            display: flex;
            gap: 16px;
            font-size: 11px;
            color: var(--text-muted);
        }
        
        .status-item { display: flex; align-items: center; gap: 4px; }
        .status-label { color: var(--text-muted); }
        .status-value { color: var(--text); }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <div class="status-dot" id="statusDot"></div>
            <span class="header-title">⚡ MAGoCo Terminal</span>
            <span class="header-version">v3.0</span>
        </div>
        <div class="header-actions">
            <button class="btn" onclick="showSysinfo()">📊 System</button>
            <button class="btn" onclick="showFiles()">📁 Files</button>
            <button class="btn" onclick="clearTerminal()">🗑️ Clear</button>
        </div>
    </div>
    
    <!-- Terminal Output -->
    <div class="terminal" id="terminal"></div>
    
    <!-- Input -->
    <div class="input-area">
        <span class="prompt" id="prompt">$</span>
        <input type="text" id="cmd" placeholder="Type command..." autofocus autocomplete="off">
        <button id="runBtn" onclick="execute()">Run</button>
    </div>
    
    <!-- Status Bar -->
    <div class="status-bar">
        <div class="status-item">
            <span class="status-label">CWD:</span>
            <span class="status-value" id="cwdDisplay">/tmp</span>
        </div>
        <div class="status-item">
            <span class="status-label">Session:</span>
            <span class="status-value" id="sessionDisplay">default</span>
        </div>
        <div class="status-item">
            <span class="status-label">Commands:</span>
            <span class="status-value" id="cmdCount">0</span>
        </div>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const cmdInput = document.getElementById('cmd');
        const runBtn = document.getElementById('runBtn');
        const statusDot = document.getElementById('statusDot');
        const cwdDisplay = document.getElementById('cwdDisplay');
        const sessionDisplay = document.getElementById('sessionDisplay');
        const cmdCountDisplay = document.getElementById('cmdCount');
        
        const history = [];
        let historyIdx = -1;
        let cmdTotal = 0;
        let sessionId = 'default';
        let currentCwd = '/tmp';
        
        // ===== HELPERS =====
        function addLine(text, type = 'out') {
            const div = document.createElement('div');
            div.className = `terminal-line ${type}-line`;
            div.textContent = text;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }
        
        function setStatus(online) {
            statusDot.className = online ? 'status-dot' : 'status-dot offline';
        }
        
        function updatePrompt() {
            const short = currentCwd.length > 30 ? '...' + currentCwd.slice(-27) : currentCwd;
            document.getElementById('prompt').textContent = `${short} $`;
        }
        
        // ===== HEALTH CHECK =====
        async function checkHealth() {
            try {
                const res = await fetch('/health');
                setStatus(res.ok);
                if (res.ok) {
                    const data = await res.json();
                    // Update session info from server
                }
            } catch { setStatus(false); }
        }
        
        // ===== EXECUTE =====
        async function execute() {
            const cmd = cmdInput.value.trim();
            if (!cmd) return;
            
            cmdInput.value = '';
            runBtn.disabled = true;
            addLine(`$ ${cmd}`, 'cmd');
            history.push(cmd);
            historyIdx = history.length;
            cmdTotal++;
            cmdCountDisplay.textContent = cmdTotal;
            
            try {
                const res = await fetch('/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: cmd, sessionId })
                });
                
                const data = await res.json();
                
                if (data.output && data.output.trim()) {
                    data.output.trim().split('\n').forEach(l => addLine(l, 'out'));
                }
                if (data.error && data.error.trim()) {
                    data.error.trim().split('\n').forEach(l => addLine(l, 'err'));
                }
                if (data.exitCode !== 0) {
                    addLine(`[exit ${data.exitCode}]`, 'warn');
                }
                if (data.cwd) {
                    currentCwd = data.cwd;
                    cwdDisplay.textContent = currentCwd;
                    updatePrompt();
                }
            } catch (err) {
                addLine(`Network error: ${err.message}`, 'err');
            }
            
            runBtn.disabled = false;
            cmdInput.focus();
        }
        
        // ===== SYSTEM INFO =====
        async function showSysinfo() {
            addLine('--- System Info ---', 'info');
            try {
                const res = await fetch('/sysinfo');
                const data = await res.json();
                if (data.output) {
                    data.output.trim().split('\n').forEach(l => addLine(l, 'out'));
                }
                if (data.system) {
                    addLine(`Platform: ${data.system.platform} (${data.system.arch})`, 'info');
                    addLine(`Hostname: ${data.system.hostname}`, 'info');
                    addLine(`CPUs: ${data.system.cpus} | RAM: ${data.system.freeMem}/${data.system.totalMem}`, 'info');
                }
            } catch (err) {
                addLine(`Error: ${err.message}`, 'err');
            }
            addLine('---', 'info');
        }
        
        // ===== FILES =====
        async function showFiles() {
            addLine(`--- Files in ${currentCwd} ---`, 'info');
            try {
                const res = await fetch('/files', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dir: currentCwd })
                });
                const data = await res.json();
                if (data.output) {
                    data.output.trim().split('\n').forEach(l => addLine(l, 'out'));
                }
            } catch (err) {
                addLine(`Error: ${err.message}`, 'err');
            }
            addLine('---', 'info');
        }
        
        // ===== CLEAR =====
        function clearTerminal() {
            terminal.innerHTML = '';
        }
        
        // ===== KEYBOARD SHORTCUTS =====
        cmdInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                execute();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (historyIdx > 0) {
                    historyIdx--;
                    cmdInput.value = history[historyIdx];
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (historyIdx < history.length - 1) {
                    historyIdx++;
                    cmdInput.value = history[historyIdx];
                } else {
                    historyIdx = history.length;
                    cmdInput.value = '';
                }
            } else if (e.key === 'l' && e.ctrlKey) {
                e.preventDefault();
                clearTerminal();
            } else if (e.key === 'c' && e.ctrlKey) {
                e.preventDefault();
                addLine('^C', 'warn');
                cmdInput.value = '';
            }
        });
        
        // ===== INIT =====
        addLine('⚡ MAGoCo Terminal v3.0', 'info');
        addLine('Type commands. Ctrl+L to clear. Ctrl+C to cancel. ↑↓ history.', 'info');
        addLine('─'.repeat(50), 'info');
        
        checkHealth();
        setInterval(checkHealth, 30000);
        updatePrompt();
    </script>
</body>
</html>
